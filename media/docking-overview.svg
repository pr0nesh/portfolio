<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
  <title>Autonomous docking: the robot finds its charging dock, aligns and docks to recharge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2563eb" fill-opacity="0.12"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <g id="robot">
      <rect x="-40" y="-16" width="10" height="32" rx="3" fill="#1e293b"/>
      <rect x="30" y="-16" width="10" height="32" rx="3" fill="#1e293b"/>
      <circle r="32" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
      <circle r="12" fill="#2563eb"/>
      <circle r="4.5" fill="#ffffff"/>
      <path d="M -9 -24 L 0 -35 L 9 -24 z" fill="#2563eb"/>
    </g>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#dots)"/>

  <!-- title chip -->
  <rect x="32" y="28" width="236" height="34" rx="17" fill="#ffffff" stroke="#dbeafe"/>
  <text x="50" y="50" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#2563eb">AUTONOMOUS DOCKING</text>

  <!-- wall and charging dock -->
  <rect x="150" y="92" width="660" height="10" rx="5" fill="#cbd5e1"/>
  <g filter="url(#soft)">
    <rect x="400" y="102" width="160" height="62" rx="14" fill="#1e293b"/>
  </g>
  <rect x="438" y="160" width="22" height="8" rx="2" fill="#60a5fa"/>
  <rect x="500" y="160" width="22" height="8" rx="2" fill="#60a5fa"/>
  <path d="M 486 114 L 468 138 L 482 138 L 474 156 L 494 130 L 480 130 z" fill="#60a5fa"/>
  <text x="480" y="196" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="12" fill="#64748b">charging dock</text>

  <!-- sensing -->
  <path d="M 230 420 L 330 140 L 620 140 z" fill="#60a5fa" fill-opacity="0.12"/>

  <!-- approach path -->
  <path d="M 230 384 C 230 300, 480 330, 480 222" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>

  <!-- robot: start and on the way -->
  <use href="#robot" x="355" y="316" opacity="0.3"/>
  <g filter="url(#soft)"><use href="#robot" x="230" y="420"/></g>
  <text x="230" y="482" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="12" fill="#64748b">robot</text>

  <!-- steps -->
  <g filter="url(#soft)">
    <rect x="640" y="236" width="270" height="48" rx="24" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="640" y="300" width="270" height="48" rx="24" fill="#ffffff" stroke="#dbeafe"/>
    <rect x="640" y="364" width="270" height="48" rx="24" fill="#ffffff" stroke="#dbeafe"/>
  </g>
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="666" cy="260" r="14" fill="#2563eb"/><text x="666" y="265">1</text>
    <circle cx="666" cy="324" r="14" fill="#2563eb"/><text x="666" y="329">2</text>
    <circle cx="666" cy="388" r="14" fill="#2563eb"/><text x="666" y="393">3</text>
  </g>
  <g font-size="17" font-weight="600" fill="#0f172a">
    <text x="692" y="266">Find the dock</text>
    <text x="692" y="330">Align with it</text>
    <text x="692" y="394">Dock &amp; recharge</text>
  </g>

  <text x="32" y="512" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace" font-size="12" fill="#94a3b8">ROS 2 · LiDAR · TurtleBot3</text>
</svg>
